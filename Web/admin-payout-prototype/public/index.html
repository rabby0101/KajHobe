<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KajHobe · Payout Admin (prototype)</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e5e7eb;
            --brand:#e2136e; --ok:#0a7d3c; --okbg:#e7f6ec; --warnbg:#fff4e5; --warnink:#9a3412; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg); color:var(--ink); }
    header { background:var(--brand); color:#fff; padding:18px 24px; }
    header h1 { margin:0; font-size:18px; }
    header p { margin:4px 0 0; font-size:12px; opacity:.85; }
    main { max-width:920px; margin:24px auto; padding:0 16px; }
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tab { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 16px;
           cursor:pointer; font-size:14px; font-weight:600; color:var(--muted); }
    .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .tab .badge { display:inline-block; min-width:18px; padding:0 6px; margin-left:6px; border-radius:999px;
                  background:rgba(0,0,0,.12); font-size:12px; text-align:center; }
    .bar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .bar button { background:#fff; border:1px solid var(--line); border-radius:8px;
                  padding:8px 14px; cursor:pointer; font-size:14px; }
    .count { color:var(--muted); font-size:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
            padding:18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .row { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .title { font-weight:600; font-size:16px; }
    .amount { font-weight:700; font-size:18px; color:var(--brand); white-space:nowrap; }
    .grid { display:grid; grid-template-columns:140px 1fr; gap:6px 14px; margin:14px 0;
            font-size:14px; }
    .grid .k { color:var(--muted); }
    .bkash { font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.5px; }
    .warn { color:var(--warnink); font-size:13px; }
    .mismatch { color:#b91c1c; font-weight:600; }
    .reason { background:var(--warnbg); border-radius:8px; padding:10px 12px; font-size:14px; margin:6px 0 12px; }
    .actions { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
    .actions input { flex:1; min-width:160px; padding:9px 11px; border:1px solid var(--line);
                     border-radius:8px; font-size:14px; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin:8px 0; }
    .split label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
    .split input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
    .remain { font-size:13px; margin:4px 0 10px; }
    .remain.bad { color:#b91c1c; font-weight:600; }
    .approve { background:var(--ok); color:#fff; border:none; border-radius:8px;
               padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
    .approve:disabled { opacity:.5; cursor:not-allowed; }
    .empty,.err { text-align:center; color:var(--muted); padding:48px 0; }
    .err { color:#b91c1c; }
    .pill { display:inline-block; background:var(--okbg); color:var(--ok); font-size:12px;
            padding:2px 8px; border-radius:999px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>KajHobe · Admin</h1>
    <p>Prototype admin panel — provider payouts &amp; dispute resolution. Localhost only.</p>
  </header>
  <main>
    <div class="tabs">
      <button class="tab active" data-tab="payouts">Payouts<span class="badge" id="payoutsBadge">0</span></button>
      <button class="tab" data-tab="disputes">Disputes<span class="badge" id="disputesBadge">0</span></button>
    </div>
    <div class="bar">
      <button id="refresh">↻ Refresh</button>
      <span class="count" id="count"></span>
    </div>
    <div id="payoutsView"><div id="list"></div></div>
    <div id="disputesView" class="hidden"><div id="disputeList"></div></div>
  </main>

  <script>
    const fmtAmount = (n, cur) => `${cur === 'BDT' ? '৳' : ''}${Number(n).toLocaleString('en-US')}`;
    const fmtDate = (s) => s ? new Date(s).toLocaleString() : '—';
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    let currentTab = 'payouts';

    // ---- Payouts -----------------------------------------------------------
    async function loadPayouts() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const res = await fetch('/api/payouts');
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Request failed');
        const payouts = body.payouts || [];
        document.getElementById('payoutsBadge').textContent = payouts.length;
        if (currentTab === 'payouts') document.getElementById('count').textContent = `${payouts.length} awaiting payout`;
        if (payouts.length === 0) {
          list.innerHTML = '<div class="empty">🎉 No payouts pending. All released escrows are settled.</div>';
          return;
        }
        list.innerHTML = payouts.map(renderPayoutCard).join('');
      } catch (e) {
        list.innerHTML = `<div class="err">Failed to load: ${esc(e.message)}</div>`;
      }
    }

    function renderPayoutCard(p) {
      const bkash = p.provider_bkash_current || p.provider_bkash_snapshot;
      const noNumber = !bkash;
      const mismatch = p.provider_bkash_current && p.provider_bkash_snapshot
        && p.provider_bkash_current !== p.provider_bkash_snapshot;
      return `
      <div class="card" data-escrow="${p.escrow_id}">
        <div class="row">
          <div class="title">${esc(p.job_title)}${p.job_category ? ` · ${esc(p.job_category)}` : ''}</div>
          <div class="amount">${fmtAmount(p.provider_amount ?? p.amount, p.currency)}</div>
        </div>
        <div class="grid">
          <div class="k">Pay to (provider)</div><div>${esc(p.provider_name)}</div>
          <div class="k">bKash number</div>
          <div class="bkash">${noNumber ? '<span class="mismatch">⚠ none set — provider must add one</span>' : esc(bkash)}
            ${mismatch ? `<div class="warn">⚠ current ${esc(p.provider_bkash_current)} differs from snapshot ${esc(p.provider_bkash_snapshot)} — verify which to pay</div>` : ''}
          </div>
          <div class="k">From (client)</div><div>${esc(p.client_name)}</div>
          <div class="k">Released</div><div>${fmtDate(p.released_at)}</div>
        </div>
        <div class="warn">Verify the number in the bKash merchant app and send money manually, then paste the trx ID and approve.</div>
        <div class="actions">
          <input type="text" placeholder="bKash transaction ID (e.g. TRX123ABC)" />
          <button class="approve" ${noNumber ? 'disabled title="Provider has no payout number"' : ''}>Approve · Mark Paid Out</button>
        </div>
      </div>`;
    }

    // ---- Disputes ----------------------------------------------------------
    async function loadDisputes() {
      const list = document.getElementById('disputeList');
      list.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const res = await fetch('/api/disputes');
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Request failed');
        const disputes = body.disputes || [];
        document.getElementById('disputesBadge').textContent = disputes.length;
        if (currentTab === 'disputes') document.getElementById('count').textContent = `${disputes.length} open dispute${disputes.length === 1 ? '' : 's'}`;
        if (disputes.length === 0) {
          list.innerHTML = '<div class="empty">No open disputes. 🎉</div>';
          return;
        }
        list.innerHTML = disputes.map(renderDisputeCard).join('');
      } catch (e) {
        list.innerHTML = `<div class="err">Failed to load: ${esc(e.message)}</div>`;
      }
    }

    function renderDisputeCard(d) {
      const noNumber = !d.provider_bkash;
      return `
      <div class="card" data-escrow="${d.escrow_id}" data-amount="${d.amount}">
        <div class="row">
          <div class="title">${esc(d.job_title)}${d.job_category ? ` · ${esc(d.job_category)}` : ''}</div>
          <div class="amount">${fmtAmount(d.amount, d.currency)} held</div>
        </div>
        <div class="grid">
          <div class="k">Client (buyer)</div><div>${esc(d.client_name)}</div>
          <div class="k">Provider</div><div>${esc(d.provider_name)}</div>
          <div class="k">Provider bKash</div>
          <div class="bkash">${noNumber ? '<span class="mismatch">⚠ none set — needed if you pay the provider</span>' : esc(d.provider_bkash)}</div>
          <div class="k">Raised by</div><div>${esc(d.raised_by_name)} · ${fmtDate(d.raised_at)}</div>
        </div>
        ${d.reason ? `<div class="reason">“${esc(d.reason)}”</div>` : ''}
        <div class="warn">Send each leg's money manually in bKash first, then record the split below. Refund + payout must not exceed the held amount.</div>
        <div class="split">
          <div><label>Refund to buyer (৳)</label><input type="number" min="0" step="1" class="refund" value="0" /></div>
          <div><label>Pay to provider (৳)</label><input type="number" min="0" step="1" class="payout" value="0" /></div>
          <div><label>Refund trx ID (optional)</label><input type="text" class="refundTrx" placeholder="TRX…" /></div>
          <div><label>Payout trx ID (optional)</label><input type="text" class="payoutTrx" placeholder="TRX…" /></div>
        </div>
        <div class="remain" data-remain>Remaining: ${fmtAmount(d.amount, d.currency)}</div>
        <div class="actions">
          <input type="text" class="notes" placeholder="Resolution notes (optional)" />
          <button class="resolve approve">Resolve dispute</button>
        </div>
      </div>`;
    }

    function updateRemain(card) {
      const amount = Number(card.dataset.amount) || 0;
      const refund = Math.max(0, Math.trunc(Number(card.querySelector('.refund').value) || 0));
      const payout = Math.max(0, Math.trunc(Number(card.querySelector('.payout').value) || 0));
      const remaining = amount - refund - payout;
      const el = card.querySelector('[data-remain]');
      const over = remaining < 0;
      el.classList.toggle('bad', over);
      el.textContent = over
        ? `Over by ৳${(-remaining).toLocaleString('en-US')} — reduce the split`
        : `Remaining (forfeited / fee): ৳${remaining.toLocaleString('en-US')}`;
      card.querySelector('.resolve').disabled = over || (refund === 0 && payout === 0);
    }

    // ---- Tabs --------------------------------------------------------------
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('payoutsView').classList.toggle('hidden', tab !== 'payouts');
      document.getElementById('disputesView').classList.toggle('hidden', tab !== 'disputes');
      refreshCurrent();
    }
    function refreshCurrent() { return currentTab === 'payouts' ? loadPayouts() : loadDisputes(); }

    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    document.getElementById('refresh').addEventListener('click', refreshCurrent);

    // ---- Payout approve handler -------------------------------------------
    document.getElementById('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('.approve');
      if (!btn) return;
      const card = btn.closest('.card');
      const escrowId = card.dataset.escrow;
      const trx = card.querySelector('input').value.trim();
      if (!confirm('Confirm you have already sent the money via bKash. Mark this payout as paid out?')) return;
      btn.disabled = true; btn.textContent = 'Approving…';
      try {
        const res = await fetch(`/api/payouts/${escrowId}/approve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ trx_id: trx || null, notes: 'Manual bKash payout via admin panel' }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Approve failed');
        card.querySelector('.actions').innerHTML = '<span class="pill">✓ Paid out</span>';
        setTimeout(loadPayouts, 800);
      } catch (err) {
        alert('Failed: ' + err.message);
        btn.disabled = false; btn.textContent = 'Approve · Mark Paid Out';
      }
    });

    // ---- Dispute resolve handler ------------------------------------------
    const disputeList = document.getElementById('disputeList');
    disputeList.addEventListener('input', (e) => {
      if (e.target.classList.contains('refund') || e.target.classList.contains('payout')) {
        updateRemain(e.target.closest('.card'));
      }
    });
    disputeList.addEventListener('click', async (e) => {
      const btn = e.target.closest('.resolve');
      if (!btn) return;
      const card = btn.closest('.card');
      const escrowId = card.dataset.escrow;
      const amount = Number(card.dataset.amount) || 0;
      const refund = Math.max(0, Math.trunc(Number(card.querySelector('.refund').value) || 0));
      const payout = Math.max(0, Math.trunc(Number(card.querySelector('.payout').value) || 0));
      if (refund + payout > amount) { alert('Refund + payout exceeds the held amount.'); return; }
      if (refund === 0 && payout === 0) { alert('Enter a refund and/or payout amount.'); return; }
      if (!confirm(`Resolve this dispute?\n\nRefund buyer: ৳${refund}\nPay provider: ৳${payout}\n\nConfirm you have already sent the money in bKash.`)) return;
      btn.disabled = true; btn.textContent = 'Resolving…';
      try {
        const res = await fetch(`/api/disputes/${escrowId}/resolve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            refund_amount: refund, payout_amount: payout,
            refund_trx: card.querySelector('.refundTrx').value.trim() || null,
            payout_trx: card.querySelector('.payoutTrx').value.trim() || null,
            notes: card.querySelector('.notes').value.trim() || null,
          }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Resolve failed');
        card.querySelector('.actions').innerHTML = '<span class="pill">✓ Resolved</span>';
        setTimeout(loadDisputes, 800);
      } catch (err) {
        alert('Failed: ' + err.message);
        btn.disabled = false; btn.textContent = 'Resolve dispute';
      }
    });

    // initial load: both badges, show payouts
    loadPayouts();
    loadDisputes();
  </script>
</body>
</html>
